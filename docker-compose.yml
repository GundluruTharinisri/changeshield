services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://changeshield:changeshield@db:5432/changeshield
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: changeshield
      POSTGRES_PASSWORD: changeshield
      POSTGRES_DB: changeshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeshield -d changeshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
